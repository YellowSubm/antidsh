# dsh-antidsh-mcp — expose this dsh Desktop / dsh web session control plane over MCP.
#
# Installed into a profile from GitHub (or a local checkout):
#
#   # For dsh Desktop (or install directly from Desktop's Plugins UI):
#   dsh plugin --profile desktop add github:YellowSubm/antidsh
#
#   # For dsh web:
#   npx @deepseek-ai/dsh plugin --profile web add github:YellowSubm/antidsh
#
# Zero-config defaults:
#   - `autoToken: true` generates and persists a random Bearer token at
#     `<DSH_HOME>/antidsh-token` when no explicit `token` / `ANTIDSH_MCP_TOKEN`
#     is set.
#   - `publishRuntimeFile: true` writes the bound endpoint URL and token to
#     `<DSH_HOME>/antidsh-runtime.json` so the companion Antigravity plugin
#     discovers `dsh Desktop` automatically across restarts and random ports.
#
# Configuration is optional. A profile-level patch replaces this row's whole
# `config` object (patches never deep-merge), so declare every option you want
# to override:
#
#   - id: dsh-antidsh-mcp
#     config:
#       path: /antidsh/mcp
#       token: ''
#       autoToken: true
#       publishRuntimeFile: true
#       allowUnauthenticatedLoopback: false
#       defaultWaitMs: 0
- insert:
    - id: dsh-antidsh-mcp
      name: 'dsh-antidsh-mcp'
